<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscripción </title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="../css/inscripciones.css">
        <link rel="stylesheet" href="../css/estilo_general.css">
    </head>

    <body>
        <header class="bg-dark text-white text-center py-4 mb-4 shadow-sm border-bottom border-secondary border-4 position-relative">
            <a href="Pagina1.html" class="btn btn-outline-light position-absolute top-50 start-0 translate-middle-y ms-3" title="Volver al inicio">
                <i class="bi bi-house-door-fill fs-5"></i>
            </a>
            <h1 class="h1 fw-bold fs-4 fs-md-2">Inscripción actividad deportiva</h1>
        </header>

        <main class="container mb-5">
            <section id="Informacion_actividad" class="card p-4 mx-auto mb-4">
                <div class="row gy-3 gx-5">
                    <h2 class="h3 fw-bold border-bottom pb-2">Informacion de la actividad</h2>
                    <div class="col-12 col-md-6">
                        <label for="actividad" class="form-label fw-semibold">Actividad: </label>
                        <input type="text" id="actividad" class="form-control" name="actividad" placeholder="Futbol" disabled>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="lugar" class="form-label fw-semibold">Lugar: </label>
                        <input type="text" id="lugar" class="form-control" name="lugar" placeholder="Complejo Deportivo Universitario – Cancha de fútbol" disabled>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="día" class="form-label fw-semibold">Dia: </label>
                        <input type="text" id="día" class="form-control" name="día" placeholder="Lunes y miércoles" disabled>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="horario" class="form-label fw-semibold">Horarios: </label>
                        <input type="text" id="horario" class="form-control" name="horario" placeholder="18 - 20hs" disabled>
                    </div>
                </div>
            </section>

            <section id="inscripcion" class="card p-4 mx-auto mb-4">
                <h2 class="h3 fw-bold border-bottom pb-2">Formulario de inscripcion</h2>
                <form action="Creación_de_inscripciones.html" method="post">
                    <ul class="list-unstyled row gy-3 gx-5">
                        <li class="col-12 col-md-6">
                            <label for="nom_ap" class="form-label fw-semibold">Apellido y nombre: </label>
                            <input type="text" maxlength="100" id="nom_ap" class="form-control" name="nom_ap" placeholder="Max Verstappen" required>
                        </li>

                        <li class="col-12 col-md-6">
                            <label for="dni" class="form-label fw-semibold">DNI (sin puntos): </label>
                            <input type="number" id="dni" class="form-control" name="dni" min="00000001" max="99999999" placeholder="50.000.000" required>
                        </li>

                        <li class="col-12 col-md-6">
                            <label for="fec_nac" class="form-label fw-semibold">Fecha de nacimiento: </label>
                            <input type="date" id="fec_nac" class="form-control" name="fec_nac" required>
                        </li>

                        <li class="col-12 col-md-6">
                            <label for="email" class="form-label fw-semibold">Correo electrónico: </label>
                            <input type="email" id="email" class="form-control" name="email" placeholder="maxverstappen@gmail.com" size="25" required>
                        </li>

                        <li class="col-12 col-md-6">
                            <label for="telefono" class="form-label fw-semibold">Telefono: </label>
                            <input type="tel" id="telefono" class="form-control" name="telefono" placeholder="3834064060" required>
                        </li>

                        <li class="col-12 col-md-6">
                            <label class="form-label fw-semibold d-block">Sexo: </label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="femenino" name="sexo" value="F" required>
                                <label class="form-check-label" for="femenino">Femenino</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="masculino" name="sexo" value="M" checked required>
                                <label class="form-check-label" for="masculino">Masculino</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" id="nb" name="sexo" value="NB" required>
                                <label class="form-check-label" for="nb">No Binario</label>
                            </div>
                        </li>

                        <li class="col-12 col-md-6">
                            <label for="nivel" class="form-label fw-semibold d-block">Nivel: </label>
                            <select id="nivel" class="form-select">
                                <option value="inicial">Inicial</option>
                                <option value="intermedio">Intermedio</option>
                                <option value="avanzado">Avanzado</option>
                            </select>
                        </li>

                        <li class="col-12 col-md-6">
                            <label for="exp" class="form-label fw-semibold d-block">¿Posee experiencia previa?</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="experiencia" id="exp" value="SI" checked required>
                                <label class="form-check-label" for="exp">Sí</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="experiencia" id="no_exp" value="NO" required>
                                <label class="form-check-label" for="no_exp">No</label>
                            </div>
                        </li>

                        <li class="col-12">
                            <label for="observaciones" class="form-label fw-semibold">Observaciones: </label><br>
                            <textarea id="observaciones" class="form-control" placeholder="Detalles a tener en cuenta acerca de la inscripcion..."></textarea>
                        </li>

                        <li class="col-12">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-control" id="condiciones" checked required>
                                <label for="condiciones" class="form-check-label">¿Acepta las condiciones de inscripción?</label>
                            </div>
                        </li>

                    </ul>
                    <div class="col-12 mt-4 d-flex gap-2">
                        <input type="submit" value="Guardar" class="btn btn-dark px-4">
                        <input type="reset" value="Cancelar" class="btn btn-secondary px-4">
                    </div>
                </form>
            </section>
        </main>

        <div class="bg-dark text-white border-top border-2 border-secondary mt-5" data-bs-theme="dark">
            <footer class="py-4">
                <p class="text-center text-secondary-emphasis mb-0">© 2026 Deportes UNCA – Todos los derechos reservados</p>
            </footer>
        </div>
    </body>
</html>
