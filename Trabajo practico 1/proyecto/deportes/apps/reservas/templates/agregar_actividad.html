{% load static %}

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Agregar actividad </title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'css/inscripciones.css' %}">
        <link rel="stylesheet" href="{% static 'css/estilo_general.css' %}">
    </head>
    <body class="d-flex flex-column min-vh-100">
        <header class="bg-dark text-white text-center py-4 mb-4 shadow-sm border-bottom border-secondary border-4 position-relative">
            <h1 class="h1 fw-bold fs-4 fs-md-2">Nueva actividad deportiva</h1>
        </header>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10">
                    <section id="inscripcion" class="card p-4 mx-auto mb-4 mt-4">
                        <h2 class="h3 fw-bold pb-2">Formulario nueva Actividad Deportiva</h2>
                         <form method="post" enctype="multipart/form-data">
                            <ul class="list-unstyled row gy-3 gx-5">
                                {% for field in form %}
                                <li class="col-12 col-md-6">
                                    {{field.label_tag}} {{field}}
                                    {{field.error}}
                                </li>
                                {% endfor %}
                            </ul>
                            {% csrf_token %}
                            <div id="botones-submit" class="col-12 mt-4 d-flex gap-2">
                                <input type="submit" value="Guardar" class="btn btn-dark px-4">
                                <input type="reset" value="Cancelar" class="btn btn-secondary px-4">
                            </div>
                         </form>
                    </section>
                </div>
            </div>
        </div>
        <div class="bg-dark text-white border-top border-2 border-secondary mt-auto" data-bs-theme="dark">
            <footer class="py-4">
                <p class="text-center text-secondary-emphasis mb-0">© 2026 Deportes UNCA – Todos los derechos reservados</p>
            </footer>
        </div>
    </body>
</html>
